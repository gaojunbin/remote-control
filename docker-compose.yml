# remote-control stack: gateway + TLS proxy, with an optional local speech-to-text service.
#
#   cp .env.example .env      # then set PUBLIC_ORIGIN, DOMAIN and RC_PASSWORD
#   docker compose up -d
#
# Only PUBLIC_ORIGIN and RC_PASSWORD are required; DOMAIN is optional and switches Caddy between
# automatic HTTPS and plain HTTP on port 80. The gateway is not published on the host: Caddy is the
# only way in.

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      target: release
    image: rc-gateway:latest
    container_name: rc-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    expose:
      - "8787"
    # The image already drops to uid 10001; this is the outer layer. /data stays writable, and
    # /tmp is a tmpfs because Starlette spools a large upload there before the size cap trips.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - rc-data:/data
      # Optional APNs signing key. Point APNS_KEY_PATH at the mounted path and make the file
      # readable by uid 10001 before enabling it.
      # - ./secrets/AuthKey.p8:/run/secrets/apns/AuthKey.p8:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: rc-caddy
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      # Compose resolves an empty DOMAIN to the plain-HTTP site address; Caddy cannot do that
      # itself because its default only applies to a variable that is not set at all.
      CADDY_SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Caddy keeps NET_BIND_SERVICE so it can take 80 and 443, and needs a writable /data for
    # the certificates it provisions.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional: an OpenAI-compatible Whisper server on the internal network, so voice input never
  # leaves the VPS. Start it with `docker compose --profile local-stt up -d` and set
  #   STT_PROVIDER=openai
  #   STT_BASE_URL=http://stt:8000/v1
  #   STT_MODEL=Systran/faster-distil-whisper-small.en   (or another model speaches can fetch)
  # in .env. The first request downloads the model into the stt-models volume.
  stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: rc-stt
    profiles: ["local-stt"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    volumes:
      - stt-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  rc-data:
  caddy-data:
  caddy-config:
  stt-models:
