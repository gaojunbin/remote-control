name: RemoteControl
options:
  bundleIdPrefix: com.junbingao
  deploymentTarget:
    macOS: '15.0'
  xcodeVersion: '16.0'
packages:
  RemoteControlMac:
    path: .
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RemoteControl:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: RemoteControlMac
        product: RCMac
    settings:
      base:
        PRODUCT_NAME: Remote Control
        PRODUCT_BUNDLE_IDENTIFIER: com.junbingao.remotecontrol.mac
        CODE_SIGN_ENTITLEMENTS: App/RemoteControl.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: '1.11.0'
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Remote Control
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate a message. Your gateway transcribes it into an editable draft; nothing is sent automatically.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
schemes:
  RemoteControl:
    build:
      targets:
        RemoteControl: all
    run:
      config: Debug
      commandLineArguments:
        "--demo --ephemeral": false
