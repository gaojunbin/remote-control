[project]
name = "rc-client"
version = "0.1.0"
description = "remote-control device daemon: drives Claude Code and Codex on this machine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "websockets>=14.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
rc-client = "rc_client.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rc_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["rc_client", "tests"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
