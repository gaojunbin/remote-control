name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-upload
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ios-check.yml

  upload:
    name: Sign and upload to App Store Connect
    needs: checks
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signing configuration
        env: &signing
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.junbingao.remotecontrol' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ci-testflight.sh --preflight
      - name: Install the project generator
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Archive, sign and upload
        env: *signing
        run: bash scripts/ci-testflight.sh
      - name: Remove temporary signing material
        if: always()
        env: *signing
        run: bash scripts/ci-testflight.sh --cleanup
