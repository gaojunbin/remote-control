name: Android checks

on:
  push:
    # Branches only: a tag push ignores `paths` and would run the same commit twice.
    branches:
      - master
    paths:
      - 'android/**'
      - 'ios/App/Localizable.xcstrings'
      - 'ios/Sources/RCUI/Resources/Markdown/**'
      - 'protocol/**'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/App/Localizable.xcstrings'
      - 'ios/Sources/RCUI/Resources/Markdown/**'
      - 'protocol/**'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A prefix distinct from callers, so a reusable call cannot cancel its caller.
  group: android-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Android app build, core and JVM tests, screenshots and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Core tests, app tests and screenshots, lint, debug build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test reports, screenshots and the debug build
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
            android/app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
