# Several builds may run side by side on one machine, so each daemon is bounded, compiles Kotlin
# inside itself rather than in a second JVM, and goes away after a quarter of an hour idle.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon.idletimeout=900000
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
